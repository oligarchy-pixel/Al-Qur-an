<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:SchB;src:url(scheherazade-new-arabic-700-normal.woff2)}
html,body{margin:0;background:#050506}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1350"></canvas>
<script type="module">
const c = document.getElementById('c').getContext('2d'); const W = 1080, H = 1350, N = 8;
const GOLD = '#E4C47B', GOLD2 = '#AF9A69', WHITE = '#F0EEEC', SANS = '"Inter Display", Inter, sans-serif';
const load = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = s; });
await document.fonts.load('100px SchB'); await document.fonts.load(`bold 60px ${SANS}`);
const S = [
 { bg: 'bg_158.0.png', y: 470, dim: .5, cover: true },
 { bg: 'bg_11.8.png', y: 250, dim: .72, ar: 'إِنَّ ٱلنَّفۡسَ لَأَمَّارَةُۢ بِٱلسُّوٓءِ', q: [['"Sesungguhnya nafsu itu sangat menyuruh kepada '], ['kejahatan', 1], ['..."']], src: 'QS. Yusuf 12:53' },
 { bg: 'bg_34.0.png', y: 250, dim: .7, q: [['Melawan nafsu dan mengarahkannya ke jalan Allah, itulah '], ['jihad yang paling besar.', 1]], src: 'Kajian Ep2 · Melawan nafsu' },
 { bg: 'bg_72.0.png', y: 300, dim: .7, q: [['Syaitan boleh dihadapi dengan '], ['zikir.', 1], [' Tetapi nafsu berada dalam diri: '], ['latih diri dan mohon pertolongan Allah.', 1]], src: 'Kajian Ep2 · Musuh dalam diri' },
 { bg: 'bg_104.0.png', y: 260, dim: .72, ar: 'أَفَمَن زُيِّنَ لَهُۥ سُوٓءُ عَمَلِهِۦ فَرَءَاهُ حَسَنٗا', q: [['Nafsu boleh membuat '], ['keburukan', 1], [' kelihatan '], ['indah.', 1]], src: 'Rujukan: QS. Fatir 35:8' },
 { bg: 'bg_125.0.png', y: 250, dim: .7, q: [['Cinta sejati bukan sekadar melihat kebaikan. Ia melihat '], ['cela,', 1], [' lalu berusaha '], ['memperbaikinya.', 1]], src: 'Kajian Ep2 · Nafsu menghias keburukan' },
 { bg: 'bg_148.5.png', y: 300, dim: .74, ar: 'أَلَمۡ يَعۡلَم بِأَنَّ ٱللَّهَ يَرَىٰ', q: [['Di tempat sunyi, ingat '], ['Allah mengawasi.', 1], [' Di tengah masyarakat, jangan rasa diri '], ['paling mulia.', 1]], src: 'Rujukan: QS. Al-\'Alaq 96:14' },
 { bg: 'bg_1.6.png', y: 120, dim: .7, q: [['Jangan biarkan amalan berubah menjadi '], ['kesombongan.', 1]], src: 'Kajian Ep2 · Penutup', last: true },
];
const i = parseInt(new URLSearchParams(location.search).get('i') || '0'), s = S[i];
const bg = await load(s.bg), pf = await load('profile.jpg');
c.fillStyle = '#050506'; c.fillRect(0, 0, W, H);
c.drawImage(bg, 0, -s.y, 1080, 1920);
c.fillStyle = `rgba(5,5,6,${s.dim})`; c.fillRect(0, 0, W, H);
let g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(5,5,6,.55)'); g.addColorStop(.3, 'rgba(5,5,6,0)'); g.addColorStop(.7, 'rgba(5,5,6,0)'); g.addColorStop(1, 'rgba(5,5,6,.85)'); c.fillStyle = g; c.fillRect(0, 0, W, H);
const T = (t, x, y, f, col, al = 'left', ls = '0px', sh = 0) => { c.save(); c.font = f; c.fillStyle = col; c.textAlign = al; c.letterSpacing = ls; if (sh) { c.shadowColor = typeof col === 'string' ? col : GOLD; c.shadowBlur = sh; } c.fillText(t, x, y); c.restore(); };
const gold = (y0, y1) => { const q = c.createLinearGradient(0, y0, 0, y1); q.addColorStop(0, '#FFE7A8'); q.addColorStop(.6, '#E4B85E'); q.addColorStop(1, '#B98A3E'); return q; };
// bingkai tipis emas
c.strokeStyle = 'rgba(228,196,123,.28)'; c.lineWidth = 2; c.strokeRect(36, 36, W - 72, H - 72);
T(`NAFSU  ·  ${String(i + 1).padStart(2, '0')}/${String(N).padStart(2, '0')}`, 80, 110, `600 24px ${SANS}`, GOLD2, 'left', '5px');
T('KAJIAN AL-QUR\'AN', W - 80, 110, `600 24px ${SANS}`, GOLD2, 'right', '5px');
function wrapSegs(segs, x, y, maxW, size, lh) {
  const words = []; segs.forEach(([t, k]) => t.split(/(\s+)/).filter(w => w.length).forEach(w => words.push([w, k])));
  c.font = `bold ${size}px ${SANS}`; c.letterSpacing = '-1.5px';
  let lines = [[]], lw = 0;
  for (const [w, k] of words) { const ww = c.measureText(w).width; if (lw + ww > maxW && w.trim()) { lines.push([]); lw = 0; } if (!lines[lines.length - 1].length && !w.trim()) continue; lines[lines.length - 1].push([w, k, ww]); lw += ww; }
  lines.forEach((ln, li) => { let xx = x; for (const [w, k, ww] of ln) { T(w, xx, y + li * lh, `bold ${size}px ${SANS}`, k ? GOLD : WHITE, 'left', '-1.5px'); xx += ww; } });
  return y + (lines.length - 1) * lh;
}
function footer(next = true) {
  c.save(); c.beginPath(); c.arc(112, H - 112, 34, 0, 7); c.clip(); c.fillStyle = '#1a6b45'; c.fillRect(70, H - 154, 84, 84); c.drawImage(pf, 112 - 36, H - 112 - 34, 72, 72); c.restore();
  c.strokeStyle = GOLD; c.lineWidth = 2; c.beginPath(); c.arc(112, H - 112, 34, 0, 7); c.stroke();
  T('@alurziyadahku', 162, H - 102, `bold 30px ${SANS}`, WHITE, 'left', '-0.5px');
  if (next) { c.save(); c.font = `600 26px ${SANS}`; const w = c.measureText('Geser  →').width + 56; c.fillStyle = 'rgba(228,196,123,.14)'; c.strokeStyle = 'rgba(228,196,123,.6)'; c.lineWidth = 2; c.beginPath(); c.roundRect(W - 80 - w, H - 146, w, 64, 32); c.fill(); c.stroke(); c.restore(); T('Geser  →', W - 80 - 28, H - 104, `600 26px ${SANS}`, GOLD, 'right'); }
}
if (s.cover) {
  T('Musuh paling', W / 2, 290, `bold 104px ${SANS}`, WHITE, 'center', '-3px');
  T('berbahaya ada', W / 2, 400, `bold 104px ${SANS}`, WHITE, 'center', '-3px');
  T('dalam diri', W / 2, 510, `bold 104px ${SANS}`, WHITE, 'center', '-3px');
  T('SENDIRI.', W / 2, 690, `900 150px ${SANS}`, gold(580, 700), 'center', '-5px');
  c.save(); c.globalAlpha = .35; T('SENDIRI.', W / 2, 690, `900 150px ${SANS}`, GOLD, 'center', '-5px', 40); c.restore();
  T('7 peringatan tentang nafsu', W / 2, 780, `600 40px ${SANS}`, GOLD2, 'center', '-0.5px');
  footer(true);
} else {
  let y = 300;
  if (s.ar) { c.font = '78px SchB'; const fs = Math.min(78, Math.floor(78 * (W - 160) / c.measureText(s.ar).width)); T(s.ar, W / 2, 330, `${fs}px SchB`, GOLD, 'center', '0px', 24); y = 470; }
  else { T('“', 66, 400, `900 260px ${SANS}`, 'rgba(228,196,123,.85)'); y = 470; }
  const end = wrapSegs(s.q, 80, y, W - 160, s.ar ? 60 : 68, s.ar ? 76 : 84);
  c.fillStyle = GOLD; c.fillRect(80, end + 52, 70, 4);
  T(s.src.toUpperCase(), 80, end + 104, `600 24px ${SANS}`, GOLD2, 'left', '4px');
  if (s.last) {
    ['Simpan', 'Kongsi', 'Follow'].forEach((p, k) => { const x = 80 + k * 230, on = k === 2; c.save(); c.fillStyle = on ? GOLD : 'rgba(255,255,255,.08)'; c.strokeStyle = 'rgba(228,196,123,.55)'; c.lineWidth = 2; c.beginPath(); c.roundRect(x, end + 170, 210, 72, 36); c.fill(); if (!on) c.stroke(); c.restore(); T(p, x + 105, end + 218, `bold 30px ${SANS}`, on ? '#16110a' : WHITE, 'center'); });
  }
  footer(!s.last);
}
window.DONE = true;
</script></body></html>
