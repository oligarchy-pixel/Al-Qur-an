<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Amiri;src:url('file:///home/claude/fonts/Amiri-Regular.ttf')}
@font-face{font-family:Amiri;font-weight:700;src:url('file:///home/claude/fonts/Amiri-Bold.ttf')}
:root{--y:#e9f23a;--bp:#0b3d91;--red:#d7322b;--green:#2fae5b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Inter,sans-serif;overflow:hidden}
.ab{position:absolute}
.ar{font-family:Amiri,serif;direction:rtl}
.mono{font-family:'DejaVu Sans Mono',monospace;letter-spacing:.08em}
.mk{background:var(--y);color:#111;padding:0 .1em}
.cur{display:inline-block;width:.3em;height:.3em;border-radius:50%;background:var(--y);margin-left:.1em;vertical-align:.08em}
.bp{background:var(--bp);background-image:linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px);background-size:40px 40px;border-radius:14px;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.tag{display:inline-flex;gap:10px;align-items:center;padding:6px 16px;border:2px solid #4f7cff;border-radius:10px;background:rgba(10,14,30,.9)}
.stamp{border:7px solid var(--red);color:var(--red);font:900 54px Inter;letter-spacing:.12em;padding:8px 24px;border-radius:8px;transform:rotate(-8deg);display:inline-block;background:rgba(0,0,0,.4)}
.lay{border-radius:12px;display:flex;align-items:center;justify-content:space-between;background:#0d0d0d}
.pol{background:#f4f1ea;padding:14px 14px 54px;box-shadow:0 24px 60px rgba(0,0,0,.8);position:relative}
</style></head><body><div id="c"></div>
<script>
const v = new URLSearchParams(location.search).get('v') || 'yt';
const W = v === 'yt' ? 1920 : 1080, H = v === 'yt' ? 1080 : 1920;
document.body.style.width = W + 'px'; document.body.style.height = H + 'px';
const route = (w) => { const s = w / 1000; return `<div class="bp" style="width:${w}px;height:${Math.round(330 * s)}px;position:relative;padding:${20 * s}px">
  <div class="tag" style="transform:scale(${s});transform-origin:0 0"><span class="mono" style="color:#9fb8ff;font-size:18px">01</span><span style="font:800 24px Inter">/diagram</span></div>
  <div class="mono" style="position:absolute;left:${24 * s}px;top:${78 * s}px;font-size:${18 * s}px;color:#fff">JALUR TURUNNYA AL-QUR'AN</div>
  <svg viewBox="0 0 1000 330" width="${w}" height="${330 * s}" style="position:absolute;left:0;top:0"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="44" markerHeight="44" refX="36" refY="22" orient="auto"><path d="M0 0 L44 22 L0 44Z" fill="#e9f23a"/></marker><marker id="g" markerUnits="userSpaceOnUse" markerWidth="44" markerHeight="44" refX="36" refY="22" orient="auto"><path d="M0 0 L44 22 L0 44Z" fill="#2fae5b"/></marker></defs>
   <rect x="30" y="140" width="250" height="120" rx="12" fill="none" stroke="#fff" stroke-width="4"/><text x="155" y="200" text-anchor="middle" font-family="Amiri" font-size="40" fill="#fff" direction="rtl">اللَّوْحُ الْمَحْفُوظُ</text><text x="155" y="240" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="18" fill="#fff">Lauh Mahfuzh</text>
   <path d="M286 200 H392" stroke="#e9f23a" stroke-width="5" marker-end="url(#a)"/><text x="339" y="300" text-anchor="middle" font-family="Inter" font-weight="800" font-size="22" fill="#e9f23a">sekaligus</text>
   <rect x="400" y="140" width="230" height="120" rx="12" fill="rgba(233,242,58,.12)" stroke="#e9f23a" stroke-width="5"/><text x="515" y="200" text-anchor="middle" font-family="Amiri" font-size="40" fill="#fff" direction="rtl">بَيْتُ الْعِزَّةِ</text><text x="515" y="240" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="18" fill="#fff">langit pertama</text>
   <path d="M636 200 H732" stroke="#2fae5b" stroke-width="5" stroke-dasharray="12 9" marker-end="url(#g)"/><text x="684" y="300" text-anchor="middle" font-family="Inter" font-weight="800" font-size="22" fill="#7fe0a0">bertahap</text>
   <rect x="740" y="140" width="230" height="120" rx="12" fill="none" stroke="#fff" stroke-width="4"/><text x="855" y="196" text-anchor="middle" font-family="Inter" font-weight="800" font-size="30" fill="#fff">Rasulullah</text><text x="855" y="238" text-anchor="middle" font-family="Inter" font-weight="700" font-size="20" fill="#e9f23a">± 23 tahun</text></svg></div>`; };
const layers = (w) => { const s = w / 900, row = (lab, ar, col) => `<div class="lay" style="height:${92 * s}px;border:${3 * s}px solid ${col};padding:0 ${26 * s}px;margin-top:${14 * s}px"><span class="mono" style="font-size:${17 * s}px;color:${col}">${lab}</span><span class="ar" style="font-size:${48 * s}px">${ar}</span></div>`;
  return `<div style="width:${w}px">${row('RASM · tanpa titik & baris', 'ىسم الله الرحمں الرحىم', '#ff8a5c')}${row('+ TITIK', 'بسم الله الرحمن الرحيم', '#fff')}${row('+ BARIS', 'بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ', '#e9f23a')}</div>`; };
const pol = (w, rot) => `<div class="pol" style="width:${w}px;transform:rotate(${rot}deg)"><div style="position:absolute;left:50%;top:-30px;width:2px;height:34px;background:#fff"></div><div style="position:absolute;left:calc(50% - 9px);top:-40px;width:18px;height:18px;border-radius:50%;background:#c33"></div>
  <img src="file:///home/claude/proj3/user_photo.jpg" style="display:block;width:${w - 28}px;height:${w - 28}px;object-fit:cover">
  <div class="mono" style="position:absolute;left:12px;right:12px;bottom:16px;font-size:${Math.round(w / 32)}px;color:#222;text-align:center;white-space:nowrap">FILE N° 03 · PENYAMPAI · @alurziyadahku</div></div>`;
const sub = (sz) => `<div style="display:flex;align-items:center;gap:${sz * .5}px"><div style="width:${sz * 2.3}px;height:${sz * 2.3}px;border-radius:50%;background:url(file:///home/claude/proj3/user_photo.jpg) 45% 54%/150% auto no-repeat;border:${sz * .13}px solid #e9f23a;flex:none"></div>
  <div style="font:800 ${sz}px Inter">@alurziyadahku</div><div style="position:relative;background:#d7322b;color:#fff;font:900 ${sz}px Inter;padding:${sz * .4}px ${sz * .8}px;border-radius:${sz * .3}px">SUBSCRIBE
  <svg style="position:absolute;right:-${sz * .6}px;bottom:-${sz * 1.1}px" width="${sz * 1.6}" height="${sz * 1.6}" viewBox="0 0 28 28"><path d="M2 2 L2 24 L8 18 L13 27 L17 25 L12 16 L21 16Z" fill="#fff" stroke="#000" stroke-width="2"/></svg></div></div>`;
const hud = (pad, fs) => `<div class="ab mono" style="left:${pad}px;top:${pad * .7}px;font-size:${fs}px"><span style="color:#e9f23a">●</span> ANALISIS LANGSUNG</div>
  <div class="ab mono" style="right:${pad}px;top:${pad * .7}px;font-size:${fs}px">FILE 03 · <span class="ar" style="font-size:${fs * 1.3}px">نُزُولُ الْقُرْآنِ</span></div>
  <div class="ab" style="left:0;bottom:0;height:6px;width:100%;background:#e9f23a"></div>`;
let h = `<div style="position:relative;width:${W}px;height:${H}px;background:#000;overflow:hidden">`;
if (v === 'yt') {
  h += hud(60, 22) + `
  <div class="ab ar" style="left:70px;top:105px;font-size:104px;line-height:1.5;text-align:left">نُزُولُ الْقُرْآنِ</div>
  <div class="ab" style="left:70px;top:285px;font:900 128px Inter;line-height:.98;letter-spacing:-.03em">TURUNNYA<br><span class="mk">AL-QUR'AN</span><span class="cur"></span></div>
  <div class="ab" style="left:70px;top:560px;width:860px;font:800 44px Inter;line-height:1.2">dulu <span style="color:#e9f23a">tidak bertitik</span> &amp;<br><span style="color:#e9f23a">tidak berbaris</span>, ini sejarahnya</div>
  <div class="ab" style="left:70px;top:700px">${layers(820)}</div>
  <div class="ab" style="left:980px;top:110px">${route(880)}</div>
  <div class="ab" style="left:990px;top:600px;transform:scale(.8);transform-origin:0 0"><div class="stamp">TERBONGKAR</div></div>
  <div class="ab" style="left:1490px;top:470px">${pol(360, 4)}</div>
  <div class="ab" style="left:990px;top:975px">${sub(34)}</div>`;
} else {
  h += hud(56, 24) + `
  <div class="ab ar" style="left:60px;top:150px;font-size:110px;line-height:1.5;text-align:left">نُزُولُ الْقُرْآنِ</div>
  <div class="ab" style="left:60px;top:350px;font:900 136px Inter;line-height:.98;letter-spacing:-.03em">TURUNNYA<br><span class="mk">AL-QUR'AN</span><span class="cur"></span></div>
  <div class="ab" style="left:60px;top:650px;width:960px;font:800 50px Inter;line-height:1.2">dulu <span style="color:#e9f23a">tidak bertitik</span> &amp;<br><span style="color:#e9f23a">tidak berbaris</span>, ini sejarahnya</div>
  <div class="ab" style="left:60px;top:820px">${route(960)}</div>
  <div class="ab" style="left:60px;top:1180px">${layers(540)}</div>
  <div class="ab" style="left:660px;top:1170px">${pol(360, 4)}</div>
  <div class="ab" style="left:70px;top:1560px"><div class="stamp">TERBONGKAR</div></div>
  <div class="ab" style="left:60px;top:1740px">${sub(36)}</div>`;
}
document.getElementById('c').innerHTML = h + '</div>';
</script></body></html>
