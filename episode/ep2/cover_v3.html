<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Amiri;src:url('file:///home/claude/fonts/Amiri-Regular.ttf')}
@font-face{font-family:Amiri;font-weight:700;src:url('file:///home/claude/fonts/Amiri-Bold.ttf')}
@font-face{font-family:Kalam;font-weight:700;src:url('file:///home/claude/fonts/Kalam-Bold.ttf')}
:root{--y:#e9f23a;--cream:#ebe6d6;--red:#d7322b;--gold:#b8913f;--ivory:#f7f2e7;--esp:#2b2219}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#f2f2f2;font-family:Inter,sans-serif;overflow:hidden}
.ar{font-family:Amiri,serif;direction:rtl}
.mono{font-family:'DejaVu Sans Mono',monospace;letter-spacing:.08em}
.mk{background:var(--y);color:#111;padding:0 .12em}
#c{position:relative;overflow:hidden;background:radial-gradient(ellipse at 30% 40%,#1a1a12,#000 70%)}
.grain{position:absolute;inset:0;opacity:.09;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.8))}
.net{position:absolute;inset:0}
.stamp{border:7px solid var(--red);color:var(--red);font:900 54px Inter;letter-spacing:.12em;padding:8px 24px;border-radius:8px;transform:rotate(-9deg);display:inline-block;background:rgba(0,0,0,.25)}
.dos{background:var(--cream);color:#151515;border-radius:6px;box-shadow:0 30px 70px rgba(0,0,0,.7)}
.row{display:flex;align-items:center;gap:12px;font:700 25px Inter;padding:7px 0;border-bottom:1px dashed #b9b09a}
.ck{width:30px;height:30px;border-radius:6px;background:#2fae5b;color:#fff;font:900 22px Inter;display:flex;align-items:center;justify-content:center;flex:none}
.win{background:var(--ivory);color:var(--esp);border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.8)}
.chip{display:inline-block;padding:6px 14px;border:2px solid var(--y);color:var(--y);font:700 20px 'DejaVu Sans Mono';border-radius:4px;margin:0 8px 8px 0;background:rgba(0,0,0,.5)}
.pol{background:#f4f1ea;padding:12px 12px 46px;box-shadow:0 20px 50px rgba(0,0,0,.7);position:relative}
</style></head><body>
<div id="c"></div>
<script>
const v = new URLSearchParams(location.search).get('v') || 'yt';
const W = v === 'yt' ? 1920 : 1080, H = v === 'yt' ? 1080 : 1920;
const c = document.getElementById('c'); c.style.width = W + 'px'; c.style.height = H + 'px';
document.body.style.width = W + 'px'; document.body.style.height = H + 'px';
// jaringan titik latar
let s = 7; const R = () => (s = (s * 16807) % 2147483647) / 2147483647;
let pts = [], svg = `<svg class="net" width="${W}" height="${H}">`;
for (let i = 0; i < 160; i++) pts.push([W * (.35 + R() * .65), H * R(), ['#e9f23a', '#4aa3ff', '#ff6a3d', '#b58bff', '#7fd6c2', '#555'][Math.floor(R() * 6)], 2 + R() * 4]);
for (let i = 0; i < 220; i++) { const a = pts[Math.floor(R() * 160)], b = pts[Math.floor(R() * 160)]; svg += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="rgba(255,170,60,.09)"/>`; }
pts.forEach(p => svg += `<circle cx="${p[0]}" cy="${p[1]}" r="${p[3]}" fill="${p[2]}" opacity=".55"/>`);
svg += '</svg>';
const POIN = [['menghadap kiblat', 'اسْتِقْبَالُ الْقِبْلَةِ'], ['berhenti saat menguap', 'التَّثَاؤُبُ'], ['tidak bercakap saat membaca', 'لِمُكَلِّمٍ آدَمِيٍّ'], ['mushaf di tempat tinggi', 'مَكَانٌ رَفِيعٌ'], ['tidak menafsir sendiri', 'بِرَأْيِهِ'], ['khatam lalu mulai lagi', 'الْحَالُّ الْمُرْتَحِلُ']];
const dossier = (w, n = 6) => `<div class="dos" style="width:${w}px;padding:24px 28px">
  <div style="display:flex;justify-content:space-between"><span class="mono" style="font-size:18px;color:#6b6250">DOSIER · FILE 02</span><span class="mono" style="font-size:18px;color:#d7322b">16 TEMUAN</span></div>
  ${POIN.slice(0, n).map(p => `<div class="row"><div class="ck">✓</div><span style="flex:1">${p[0]}</span><span class="ar" style="font-size:26px;color:#6b5a3e">${p[1]}</span></div>`).join('')}
  <div class="mono" style="font-size:17px;color:#6b6250;margin-top:10px">+ ${16 - n} kehormatan lainnya…</div></div>`;
const browser = (w) => `<div class="win" style="width:${w}px">
  <div style="height:40px;background:#e8dfcc;display:flex;align-items:flex-end;padding:0 12px;gap:6px"><div style="background:var(--ivory);padding:7px 16px;border-radius:8px 8px 0 0;font:700 15px Inter">Pencarian kitab</div><div style="font:700 22px Inter;color:#8a7a60;padding:0 8px 4px">+</div></div>
  <div style="padding:12px 16px;border-bottom:1px solid #e3d8c2;display:flex;gap:10px;align-items:center"><span style="font:700 15px Inter;color:var(--gold)">◆ maktabah</span><div class="ar" style="flex:1;border:2px solid var(--gold);border-radius:18px;padding:2px 16px;font-size:24px">مِنْ حُرْمَةِ الْقُرْآنِ</div></div>
  <div style="padding:14px 18px"><div class="mono" style="font-size:13px;color:#8a7a60">MUQADDIMAH TAFSIR AL-QURTHUBI · COCOK</div>
  <div class="ar" style="font-size:38px;line-height:1.6;margin-top:6px;text-align:right">وَمِنْ حُرْمَتِهِ أَنْ يَسْتَقْبِلَ <span class="mk">الْقِبْلَةَ</span></div></div></div>`;
const pol = (w) => `<div class="pol" style="width:${w}px;transform:rotate(4deg)"><div style="position:absolute;left:50%;top:-34px;width:2px;height:36px;background:#999"></div><div style="position:absolute;left:calc(50% - 9px);top:-44px;width:18px;height:18px;border-radius:50%;background:#c33;z-index:2"></div>
  <img src="file:///home/claude/proj2/user_photo.jpg" style="display:block;width:${w - 24}px;height:${w - 24}px;object-fit:cover;filter:contrast(1.05) saturate(1.05)">
  <div class="mono" style="position:absolute;left:12px;right:12px;bottom:12px;font-size:${Math.round(w / 34)}px;color:#444;text-align:center;white-space:nowrap;letter-spacing:.04em">FILE N° 02 · PENYAMPAI · @alurziyadahku</div></div>`;
const sub = (sz) => `<div style="display:flex;align-items:center;gap:${sz * .5}px"><div style="width:${sz * 2.2}px;height:${sz * 2.2}px;border-radius:50%;background:url(file:///home/claude/proj2/user_photo.jpg) 43% 26%/350% auto no-repeat;border:${Math.round(sz*.12)}px solid var(--y);box-shadow:0 0 0 3px #111,0 6px 18px rgba(0,0,0,.6);flex:none"></div>
  <div style="font:800 ${sz}px Inter">@alurziyadahku</div><div style="position:relative;background:#d7322b;color:#fff;font:900 ${sz}px Inter;padding:${sz * .4}px ${sz * .8}px;border-radius:${sz * .3}px">SUBSCRIBE
  <svg style="position:absolute;right:-${sz * .6}px;bottom:-${sz * 1.1}px" width="${sz * 1.6}" height="${sz * 1.6}" viewBox="0 0 28 28"><path d="M2 2 L2 24 L8 18 L13 27 L17 25 L12 16 L21 16Z" fill="#fff" stroke="#000" stroke-width="2"/></svg></div></div>`;
let html = svg + '<div class="grain"></div>';
if (v === 'yt') {
  html += `
  <div style="position:absolute;left:70px;top:44px" class="mono"><span style="color:#e9f23a">●</span> <span style="font-size:22px">ANALISIS LANGSUNG · FILE 02</span></div>
  <div class="ar" style="position:absolute;left:70px;top:100px;font-size:96px;color:#fff;text-align:left">حُرْمَةُ الْقُرْآنِ</div>
  <div style="position:absolute;left:70px;top:265px;font:900 112px Inter;line-height:.98;letter-spacing:-.03em">16 <span class="mk">ADAB</span><br>ALQURAN</div>
  <div style="position:absolute;left:70px;top:500px;width:900px;font:700 42px Inter;line-height:1.2;color:#eee">yang sering <span style="color:#ff6a5c">dilanggar</span><br>tanpa kita sadari</div>
  <div style="position:absolute;left:70px;top:625px">${dossier(760, 5)}</div>
  <div style="position:absolute;left:960px;top:150px">${browser(880)}</div>
  <div style="position:absolute;left:980px;top:410px"><span class="chip">TAFSIR AL-QURTHUBI</span><span class="chip">AT-TIRMIDZI</span><span class="chip">AT-TIBYAN</span></div>
  <div style="position:absolute;left:985px;top:640px;transform:scale(.82);transform-origin:left top"><div class="stamp">TERBONGKAR</div></div>
  <div style="position:absolute;left:1480px;top:530px">${pol(380)}</div>
  <div style="position:absolute;left:960px;top:975px">${sub(34)}</div>`;
} else {
  html += `
  <div style="position:absolute;left:60px;top:160px" class="mono"><span style="color:#e9f23a">●</span> <span style="font-size:26px">ANALISIS LANGSUNG · FILE 02</span></div>
  <div class="ar" style="position:absolute;left:60px;top:220px;font-size:100px;color:#fff">حُرْمَةُ الْقُرْآنِ</div>
  <div style="position:absolute;left:60px;top:380px;font:900 132px Inter;line-height:.95;letter-spacing:-.03em">16 <span class="mk">ADAB</span><br>ALQURAN</div>
  <div style="position:absolute;left:60px;top:660px;font:700 50px Inter;line-height:1.2">yang sering <span style="color:#ff6a5c">dilanggar</span><br>tanpa kita sadari</div>
  <div style="position:absolute;left:60px;top:830px">${browser(960)}</div>
  <div style="position:absolute;left:40px;top:1130px">${dossier(600, 5)}</div>
  <div style="position:absolute;left:640px;top:1170px">${pol(400)}</div>
  <div style="position:absolute;left:70px;top:1560px" class="stamp">TERBONGKAR</div>
  <div style="position:absolute;left:60px;top:1700px">${sub(38)}</div>`;
}
html += '<div class="scan"></div><div class="vig"></div>';
c.innerHTML = html;
</script></body></html>
