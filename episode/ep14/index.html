<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Amiri;src:url('file:///home/claude/fonts/Amiri-Regular.ttf')}
@font-face{font-family:Kalam;src:url('file:///home/claude/fonts/Kalam-Regular.ttf')}
@font-face{font-family:Kalam;font-weight:700;src:url('file:///home/claude/fonts/Kalam-Bold.ttf')}
@font-face{font-family:Amiri;font-weight:700;src:url('file:///home/claude/fonts/Amiri-Bold.ttf')}
:root{--y:#e9f23a;--cream:#ebe6d6;--bp:#0b3d91;--red:#d7322b;--green:#2fae5b;--ink:#141414;--gold:#b8913f;--ivory:#f7f2e7;--esp:#2b2219}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:#000;overflow:hidden;font-family:Inter,sans-serif;color:#f2f2f2}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
#stage{position:absolute;inset:0;transform:translate(0,52px) scale(.9);transform-origin:50% 0}
.ab{position:absolute}
.ar{font-family:Amiri,serif;direction:rtl;unicode-bidi:isolate}
.mono{font-family:'DejaVu Sans Mono',monospace;letter-spacing:.06em}
.seg{font-weight:800;font-size:96px;line-height:1.04;letter-spacing:-.02em}
.cur{display:inline-block;width:.32em;height:.32em;border-radius:50%;background:var(--y);margin-left:.08em;vertical-align:.08em}
.mk{background:linear-gradient(var(--y),var(--y)) no-repeat;background-size:0% 92%;background-position:left 60%;color:inherit;padding:0 .08em}
.mk.on{color:#111}
.paper{background:var(--cream);color:#151515;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.paper .hd{font:700 22px Inter;letter-spacing:.14em;color:#6b6250;text-transform:uppercase}
.chip{display:inline-block;padding:10px 18px;border:2px solid var(--y);color:var(--y);font:600 26px 'DejaVu Sans Mono';letter-spacing:.05em;border-radius:4px}
.stamp{border:6px solid var(--red);color:var(--red);font:900 44px Inter;letter-spacing:.12em;padding:8px 22px;border-radius:6px;transform:rotate(-8deg);mix-blend-mode:multiply;opacity:.92}
.blk{display:inline-flex;flex-direction:column;justify-content:space-between;padding:22px 26px;width:330px;height:230px;font:800 40px Inter;line-height:1.1}
.blk small{font:600 18px 'DejaVu Sans Mono';letter-spacing:.08em;opacity:.8}
.step{padding:26px 40px;border:3px solid #fff;border-radius:10px;font:700 44px Inter;background:#151515;color:#fff}
.bp{background:var(--bp);background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:40px 40px}
#hud{position:absolute;inset:0;pointer-events:none;z-index:50}
#scan{display:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px);z-index:49}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 70%,rgba(0,0,0,.3));z-index:48}
#noise{display:none;position:absolute;inset:0;width:1920px;height:1080px;opacity:.07;z-index:47;image-rendering:pixelated}
#sweep{display:none;position:absolute;left:0;right:0;height:120px;background:linear-gradient(transparent,rgba(233,242,58,.05),transparent);z-index:46}
#glitch{position:absolute;inset:0;z-index:60;pointer-events:none}
</style></head>
<body>
<div id="cam"><div id="stage"></div></div>
<canvas id="noise" width="480" height="270"></canvas>
<div id="sweep"></div><div id="vig"></div><div id="scan"></div>
<div id="hud">
  <div class="ab mono" id="live" style="left:56px;top:40px;font-size:22px;color:#fff">● ANALISIS LANGSUNG</div>
  <div class="ab mono" id="file" style="right:56px;top:40px;font-size:22px;color:#eee;text-align:right">FILE 14 · <span class="ar" style="font-size:28px">هُدًى لِلْمُتَّقِينَ</span></div>
  <div class="ab mono" id="tc" style="right:56px;bottom:40px;font-size:20px;color:#e6e6e6">00:00:00</div>
  <div class="ab mono" style="left:56px;bottom:40px;font-size:20px;color:#e6e6e6">@alurziyadahku</div>
  <div class="ab" id="prog" style="left:0;bottom:0;height:4px;background:var(--y);width:0"></div>
</div>
<div id="glitch"></div>
<script src="engine.js"></script>
<script src="codes.js"></script><script src="helpers.js"></script><script src="ep14.js"></script><script src="ref.js"></script>
</body></html>
