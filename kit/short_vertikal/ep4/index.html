<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Amiri;src:url('file:///home/claude/fonts/Amiri-Regular.ttf')}
@font-face{font-family:Amiri;font-weight:700;src:url('file:///home/claude/fonts/Amiri-Bold.ttf')}
:root{--y:#e9f23a;--r:#ff8a5c;--g:#7fe0a0;--b:#7fd6ff;--cream:#ebe6d6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:#000;overflow:hidden;font-family:Inter,sans-serif;color:#fff}
.ab{position:absolute}
.ar{font-family:Amiri,serif;direction:rtl;unicode-bidi:isolate}
.mono{font-family:'DejaVu Sans Mono',monospace;letter-spacing:.06em}
.mk{background:linear-gradient(var(--y),var(--y)) no-repeat;background-size:0% 92%;background-position:left 60%;padding:0 .08em}
.mk.on{color:#111}
.w{display:inline-block;opacity:0;transform:translateY(16px);margin-right:.24em}
.paper{background:var(--cream);color:#151515;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.chip{display:inline-block;padding:10px 16px;border:2px solid var(--y);color:var(--y);font:600 22px 'DejaVu Sans Mono';letter-spacing:.04em;border-radius:6px}
.card{border:4px solid var(--y);border-radius:22px;background:rgba(233,242,58,.07)}
.num{font:900 34px 'DejaVu Sans Mono';color:var(--y)}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,#16140a,#000 65%)}
#hud{position:absolute;inset:0;z-index:50;pointer-events:none}
#flash{position:absolute;inset:0;background:var(--y);opacity:0;z-index:60}
</style></head><body>
<div id="bg"></div><div id="stage" class="ab" style="inset:0"></div>
<div id="hud">
  <div class="ab mono" style="left:60px;top:150px;font-size:24px"><span style="color:var(--y)">●</span> EP 04 · RAHASIA BISMILLAH</div>
  <div class="ab mono" id="cnt" style="right:60px;top:150px;font-size:24px;color:var(--y)"></div>
  <div class="ab mono" style="left:60px;top:1560px;font-size:24px">@alurziyadahku · Mengenal Al-Qur'an</div>
  <div class="ab" style="left:60px;right:60px;top:1610px;height:6px;background:rgba(233,242,58,.2)"><div id="prog" style="height:100%;width:0;background:var(--y)"></div></div>
</div><div id="flash"></div>
<script>
const TOTAL = 170, Y = '#e9f23a', R = '#ff8a5c', GR = '#7fe0a0', BL = '#7fd6ff';
const CG = GR, CB = BL, CR = R;
const ITEMS = [], SFX = [], CUTS = [];
const S = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), eo = x => 1 - Math.pow(1 - clamp(x), 3), eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const sfx = (t, type, g = 1) => SFX.push({ t: +t.toFixed(3), type, g });
function getSFX() { return SFX; }
function node(html, css) { const d = document.createElement('div'); d.className = 'ab'; d.style.cssText = css; d.innerHTML = html; d.style.opacity = 0; S.appendChild(d); return d; }
function item(t0, t1, n, fn) { ITEMS.push({ t0, t1, n, fn }); return n; }
function show(html, css, t0, t1, kind = 'up', snd) { const n = node(html, css); if (snd) sfx(t0, snd, .8);
  return item(t0, t1, n, (lt, t) => { const k = eo(lt / .45), out = clamp((t1 - t) / .25); n.style.opacity = k * out;
    n.style.transform = kind === 'up' ? `translateY(${(1 - k) * 50}px)` : kind === 'scale' ? `scale(${.8 + .2 * k})` : kind === 'left' ? `translateX(${(1 - k) * -80}px)` : kind === 'drop' ? `translateY(${(1 - k) * -90}px) rotate(${(1 - k) * -6}deg)` : ''; }); }
// teks kinetik kata demi kata; [kata] distabilo pada marks[i]
function kin(text, css, t0, t1, o = {}) {
  const parts = []; text.replace(/\[([^\]]+)\]|([^\s\[\]]+)/g, (m, a, b) => { if (a) a.split(' ').forEach((w, j, A) => parts.push({ w, g: parts.mk = (j ? parts.mk : (parts.mk ?? -1) + 1), last: j === A.length - 1 })); else parts.push({ w: b, g: -1 }); });
  const n = node(parts.map(p => `<span class="w${p.g >= 0 ? ' mk' : ''}" data-g="${p.g}">${p.w}</span>`).join(' '), css + `;font:${o.w || 800} ${o.fs || 52}px Inter;line-height:1.3;color:${o.c || '#fff'}`);
  const W = [...n.querySelectorAll('.w')], iv = o.iv || .07, M = o.m || [];
  W.forEach((w, i) => { if (i % 3 === 0) sfx(t0 + i * iv, 'tick', .45); });
  M.forEach(m => sfx(m, 'mark', .8));
  return item(t0, t1, n, (lt, t) => { n.style.opacity = clamp((t1 - t) / .25);
    W.forEach((w, i) => { const k = eo((lt - i * iv) / .25); w.style.opacity = k; w.style.transform = `translateY(${(1 - k) * 16}px)`;
      const g = +w.dataset.g; if (g >= 0 && M[g] != null) { const u = eo((t - M[g]) / .35); w.style.backgroundSize = `${u * 100}% 92%`; w.classList.toggle('on', u > .5); } }); }); }
// arab muncul per kata
function arw(text, css, t0, t1, dur, o = {}) { const parts = []; text.replace(/\[([^\]]+)\]|([^\s\[\]]+)/g, (m, a, b) => { if (a) a.split(' ').forEach(w => parts.push({ w, g: 1 })); else parts.push({ w: b, g: 0 }); });
  const n = node(parts.map(p => `<span class="w${p.g ? ' mk' : ''}" style="margin:0 .12em">${p.w}</span>`).join(' '), css + ';font-family:Amiri,serif;direction:rtl'); n.classList.add('ar');
  const W = [...n.querySelectorAll('.w')]; sfx(t0, 'whoosh', .5); if (o.mark) sfx(o.mark, 'mark', .8);
  return item(t0, t1, n, (lt, t) => { n.style.opacity = clamp((t1 - t) / .25); W.forEach((w, i) => { const k = eo((lt - i * dur / W.length) / .35); w.style.opacity = k; w.style.transform = `translateY(${(1 - k) * 14}px)`;
    if (w.classList.contains('mk') && o.mark) { const u = eo((t - o.mark) / .35); w.style.backgroundSize = `${u * 100}% 92%`; w.classList.toggle('on', u > .5); } }); }); }
function sv(inner, css, w, h, t0, t1, dur = 1) { const n = node(`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible">${inner}</svg>`, css); sfx(t0, 'draw', .5);
  return item(t0, t1, n, (lt, t) => { n.style.opacity = clamp(lt / .2) * clamp((t1 - t) / .25);
    n.querySelectorAll('[data-d]').forEach(p => { const L = +p.dataset.d, k = eio((lt - +(p.dataset.del || 0)) / dur); p.style.strokeDasharray = L; p.style.strokeDashoffset = L * (1 - k); });
    n.querySelectorAll('[data-f]').forEach(p => { p.style.opacity = eo((lt - +p.dataset.f) / .35); }); }); }
const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" data-f="${o.f ?? 0}" text-anchor="${o.a || 'middle'}" font-family="Inter" font-weight="${o.fw || 900}" font-size="${o.fs || 34}" fill="${o.c || '#fff'}">${s}</text>`;
function scene(t, cut = 'flash') { CUTS.push({ t, cut }); if (t > 0) sfx(t, cut === 'flash' ? 'whoosh' : 'click', .7); }
const header = (no, title, t0, t1, c = Y) => show(`<div style="display:flex;align-items:center;gap:22px"><div style="width:110px;height:110px;border-radius:20px;background:${c};color:#111;font:900 56px Inter;display:flex;align-items:center;justify-content:center">${no}</div><div><div class="mono" style="font-size:24px;color:${c}">MAZHAB ${+no}</div><div style="font:900 50px Inter;line-height:1.1;margin-top:6px">${title}</div></div></div>`, 'left:70px;top:250px;width:940px', t0, t1, 'left', 'stamp');
const flow = (steps, top, t0s, t1) => steps.forEach(([e, s, c], i) => { show(`<div style="width:290px;height:250px;border:4px solid ${c};border-radius:20px;text-align:center;padding-top:26px;background:rgba(255,255,255,.03)"><div style="font-size:84px">${e}</div><div style="font:900 30px Inter;color:${c};margin-top:8px;line-height:1.15">${s}</div></div>`, `left:${60 + i * 340}px;top:${top}px`, t0s[i], t1, 'up', 'click');
  if (i) show(`<div style="font:900 50px Inter;color:${Y}">→</div>`, `left:${i * 340 + 22}px;top:${top + 95}px`, t0s[i] - .15, t1, 'scale'); });
const box2 = (c, inner) => `<div style="width:960px;border:5px solid ${c};border-radius:20px;padding:22px 28px">${inner}</div>`;
const A = x => +(x - 262.0).toFixed(2), B = x => +(x - 406.257).toFixed(2); // audio Ep4 268.0–411.9 → 6.0–149.9 ; 556.157–570.6 → 149.9–164.34
// tombol CTA: like, follow, subscribe
function cta(t0, t1, top) { const n = node(`<div style="display:flex;gap:22px;justify-content:center">
  <div class="b1" style="width:290px;height:150px;border:5px solid #ff4d6d;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center"><div class="i" style="font-size:66px">🤍</div><div style="font:900 34px Inter;color:#ff4d6d">LIKE</div></div>
  <div class="b2" style="width:290px;height:150px;border:5px solid ${Y};border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center"><div class="i" style="font-size:60px">💬</div><div style="font:900 34px Inter;color:${Y}">COMMENT</div></div>
  <div class="b3" style="width:290px;height:150px;border:5px solid #d7322b;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#d7322b"><div class="i" style="font-size:60px">🔔</div><div style="font:900 30px Inter;color:#fff">SUBSCRIBE</div></div></div>`, `left:60px;top:${top}px;width:960px`);
  const [b1, b2, b3] = ['.b1', '.b2', '.b3'].map(s => n.querySelector(s)), T0 = [t0 + .5, t0 + 1.0, t0 + 1.5]; T0.forEach(t => sfx(t, 'click', 1));
  return item(t0, t1, n, (lt, t) => { n.style.opacity = eo(lt / .3) * clamp((t1 - t) / .25);
    [b1, b2, b3].forEach((b, i) => { const k = t - T0[i], pop = k > 0 && k < .35 ? 1 + .18 * Math.sin(k / .35 * Math.PI) : 1; b.style.transform = `scale(${pop})`; });
    b1.querySelector('.i').textContent = t > T0[0] ? '❤️' : '🤍'; b1.style.background = t > T0[0] ? 'rgba(255,77,109,.18)' : '';
    b2.querySelector('.i').textContent = t > T0[1] ? '✍️' : '💬'; b2.style.background = t > T0[1] ? 'rgba(233,242,58,.18)' : '';
    b3.querySelector('.i').style.transform = t > T0[2] ? `rotate(${Math.sin(t * 24) * 18 * clamp(1 - (t - T0[2]) / 1.2)}deg)` : ''; }); }
// panah memantul ke bawah: arahkan ke tautan video terkait (kiri bawah layar aplikasi)
function arrowDown(t0, t1, txt, top) { const n = node(`<div style="display:flex;align-items:center;gap:20px"><div style="font:900 40px Inter;line-height:1.2;width:920px">${txt}</div></div><div class="ar2" style="position:absolute;left:30px;top:130px;font:900 120px Inter;color:${Y}">⬇</div>`, `left:70px;top:${top}px;width:960px;height:300px`);
  sfx(t0, 'beep', .9); return item(t0, t1, n, (lt, t) => { n.style.opacity = eo(lt / .3) * clamp((t1 - t) / .25); n.querySelector('.ar2').style.transform = `translateY(${Math.abs(Math.sin(t * 5)) * 40}px)`; }); }


// ======================================================= 0 COVER (0–1.5) · HOOK (1.5–3) · AJAKAN + ISI (3–6)
scene(0, 'none');
(() => { const n = node('<img src="cover.png" style="width:1080px;height:1920px;display:block">', 'left:0;top:0;width:1080px;height:1920px;z-index:40');
  item(0, 1.5, n, (lt, t) => { n.style.opacity = clamp((1.5 - t) / .2); n.style.transform = `scale(${1 + .02 * lt})`; }); })();
scene(1.5);
show(`<div class="ar" style="font-size:80px;color:${Y};text-align:left">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div><div style="font:900 66px Inter;line-height:1.1;margin-top:30px">dalam salat dibaca nyaring,<br>pelan, atau <span style="color:#111;background:${CR};padding:0 .12em">TIDAK?</span> 😳</div>`, 'left:70px;top:300px;width:940px', 1.55, 3.0, 'scale', 'impact');
scene(3.0);
show(`<div style="font:900 76px Inter;line-height:1.02">sebelum mulai…<br><span style="color:#111;background:${Y};padding:0 .12em">like · comment · sub</span> 🙏</div>`, 'left:70px;top:280px;width:940px', 3.05, 6.0, 'scale', 'impact');
cta(3.3, 6.0, 520);
show(`<div class="mono" style="font-size:26px;color:${Y}">DI VIDEO INI · 4 MAZHAB:</div><div style="display:flex;gap:14px;margin-top:12px">${[['01', 'Syafi\'i'], ['02', 'Malik'], ['03', 'Hanafi'], ['04', 'Hanbali']].map(([n, s]) => `<div style="width:226px;border:4px solid ${Y};border-radius:16px;text-align:center;padding:12px 0"><div class="num" style="font-size:28px">${n}</div><div style="font:900 30px Inter">${s}</div></div>`).join('')}</div>`, 'left:60px;top:720px;width:960px', 4.0, 6.0, 'up', 'tick');
arrowDown(4.6, 6.0, `📺 video lengkapnya <span style="color:${Y}">klik di bawah ini</span>`, 1000);

// ======================================================= 1 MAZHAB SYAFI'I (audio 268.0–317.1)
scene(6.0);
header('01', "IMAM ASY-SYAFI'I · ayat Al-Fatihah", A(268.0), A(317.1), Y);
kin('ayat pertama Al-Fatihah menurut Imam asy-Syafi\'i: [basmalah]', 'left:70px;top:420px;width:940px', A(268.0), A(275.3), { fs: 48, iv: .05, m: [A(273.0)] });
[['1', 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ', 274.0], ['2', 'الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ', 275.3], ['3', 'الرَّحْمَٰنِ الرَّحِيمِ', 278.5], ['4', 'مَالِكِ يَوْمِ الدِّينِ', 280.7], ['5', 'إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ', 283.4], ['6', 'اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ', 287.2], ['7', 'صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ …', 290.4]].forEach(([n, ar, t], i) => show(`<div style="width:960px;display:flex;align-items:center;gap:22px;border-left:8px solid ${i ? '#fff' : Y};background:${i ? 'rgba(255,255,255,.04)' : 'rgba(233,242,58,.12)'};padding:8px 20px"><div class="num" style="color:${i ? '#fff' : Y}">${n}</div><div class="ar" style="font-size:44px;flex:1;text-align:right;color:${i ? '#fff' : Y}">${ar}</div></div>`, `left:60px;top:${560 + i * 100}px`, A(t), A(297.7), 'left', 'tick'));
show(box2(Y, `<div class="mono" style="font-size:24px;color:${Y}">CARA MEMBACA DALAM SALAT</div><div style="font:900 40px Inter;margin-top:12px">🔊 NYARING · Subuh, Maghrib, Isya</div><div style="font:900 40px Inter;margin-top:12px">🤫 pelan · Zuhur, Asar</div>`), 'left:60px;top:440px', A(305.3), A(317.1), 'up', 'stamp');

// ======================================================= 2 MAZHAB MALIKI (audio 317.1–369.9)
scene(A(317.1));
header('02', 'IMAM MALIK · tidak dibaca dalam salat', A(317.1), A(369.9), CR);
kin('basmalah hanya [satu kali] di dalam Al-Qur\'an · bukan bagian Al-Fatihah', 'left:70px;top:420px;width:940px', A(317.1), A(334.6), { fs: 46, iv: .05, m: [A(320.0)] });
show(`<div style="width:960px;border:4px solid ${CR};border-radius:20px;padding:20px 26px;background:rgba(255,138,92,.06)"><div class="mono" style="font-size:24px;color:${CR}">QS. AN-NAML : 30</div><div class="ar" style="font-size:52px;text-align:right;margin-top:6px">إِنَّهُ مِنْ سُلَيْمَانَ وَإِنَّهُ بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div></div>`, 'left:60px;top:680px', A(334.6), A(349.8), 'up', 'stamp');
show(`<div style="font:900 40px Inter">selain itu · basmalah hanya <span style="color:${Y}">pemisah antar surah</span></div>`, 'left:70px;top:1000px;width:940px', A(344.7), A(356.3), 'up', 'beep');
show(box2(CR, `<div class="mono" style="font-size:24px;color:${CR}">DALAM SALAT MAZHAB MALIKI</div><div class="ar" style="font-size:56px;margin-top:10px;text-align:center">اللَّهُ أَكْبَرُ ← الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ</div><div style="font:900 34px Inter;margin-top:8px;text-align:center">takbir → langsung Alhamdulillah</div>`), 'left:60px;top:680px', A(356.3), A(369.9), 'up', 'stamp');

// ======================================================= 3 MAZHAB HANAFI (audio 369.9–391.8)
scene(A(369.9));
header('03', 'IMAM ABU HANIFAH · dibaca pelan', A(369.9), A(391.8), CB);
show(`<div style="display:flex;flex-direction:column;gap:18px">${[['✓', 'bagian dari Al-Qur\'an', CG], ['✕', 'bukan bagian dari Al-Fatihah', CR]].map(([m, s, c]) => `<div style="font:900 44px Inter;color:${c}">${m} ${s}</div>`).join('')}</div>`, 'left:70px;top:440px', A(370.5), A(391.8), 'left', 'tick');
flow([['🤫', 'بِسْمِ اللَّهِ pelan', CB], ['➡️', 'lalu', '#fff'], ['🔊', 'الْحَمْدُ nyaring', Y]], 760, [A(381.0), A(382.5), A(383.5)], A(391.8));

// ======================================================= 4 MAZHAB HANBALI (audio 391.8–411.9)
scene(A(391.8));
header('04', 'IMAM AHMAD · ayat Al-Fatihah, dibaca pelan', A(391.8), A(411.9), CG);
show(`<div style="font:900 44px Inter;color:${CG}">✓ basmalah ayat Al-Fatihah juga</div>`, 'left:70px;top:440px', A(392.5), A(411.9), 'left', 'tick');
flow([['🤫', 'بِسْمِ اللَّهِ pelan', CG], ['➡️', 'lalu', '#fff'], ['🔊', 'الْحَمْدُ nyaring', Y]], 600, [A(397.0), A(399.0), A(401.5)], A(411.9));
show(`<div style="font:900 46px Inter;color:#111;background:${Y};border-radius:12px;padding:12px 24px">ke luar negeri · ketemu imam begitu?<br>✓ tidak jadi masalah</div>`, 'left:70px;top:960px', A(403.9), A(411.9), 'scale', 'impact');

// ======================================================= BONUS · SURGA BERKATA (audio 556.2–570.6)
scene(B(556.157));
show(`<div class="mono" style="font-size:28px;color:${Y}">✨ BONUS · KEUTAMAAN BASMALAH</div>`, 'left:70px;top:280px', B(556.2), B(570.6), 'left', 'stamp');
kin('ucapkan basmalah · [surga pun berkata]…', 'left:70px;top:380px;width:940px', B(556.2), B(570.6), { fs: 54, iv: .06, m: [B(557.5)] });
show(`<div style="width:960px;border:3px dashed ${Y};border-radius:30px 30px 30px 4px;padding:26px 30px;font:italic 800 42px/1.4 Inter;color:#fff8d0">"Wahai Tuhan, hamba-Mu si Fulan mengucapkan basmalah… <span style="color:${Y}">jauhkan dia dari neraka & masukkan dia kepadaku</span>"</div>`, 'left:60px;top:640px', B(559.5), B(570.6), 'up', 'paper');

// ======================================================= PENUTUP + CTA (164.3–170)
scene(B(570.6));
show(`<div style="display:flex;gap:14px">${[['01', '🔊', 'Syafi\'i'], ['02', '🤐', 'Malik'], ['03', '🤫', 'Hanafi'], ['04', '🤫', 'Hanbali']].map(([n, e, s]) => `<div style="width:226px;height:170px;border:4px solid ${Y};border-radius:16px;text-align:center;padding-top:12px"><div class="num" style="font-size:24px">${n}</div><div style="font-size:48px">${e}</div><div style="font:900 26px Inter">${s}</div></div>`).join('')}</div>`, 'left:60px;top:260px', B(570.7), TOTAL, 'scale', 'tick');
cta(B(570.8), TOTAL, 480);
arrowDown(B(571.2), TOTAL, `💬 kamu ikut mazhab apa? tulis di komentar<br>tonton video lengkapnya → <span style="color:${Y}">klik di bawah ini</span>`, 700);

// ======================================================= mesin waktu
const HUDC = document.getElementById('cnt'), PROG = document.getElementById('prog'), FL = document.getElementById('flash');
const ADAB = [[A(268.0), A(317.1), 'MAZHAB 1/4'], [A(317.1), A(369.9), 'MAZHAB 2/4'], [A(369.9), A(391.8), 'MAZHAB 3/4'], [A(391.8), A(411.9), 'MAZHAB 4/4']];
window.setTime = t => {
  for (const it of ITEMS) { const on = t >= it.t0 && t < it.t1; it.n.style.display = on ? '' : 'none'; if (on) it.fn(t - it.t0, t); }
  document.getElementById('hud').style.opacity = t < 1.5 ? 0 : 1;
