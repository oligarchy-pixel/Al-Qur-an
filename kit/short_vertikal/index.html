<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Amiri;src:url('file:///home/claude/fonts/Amiri-Regular.ttf')}
@font-face{font-family:Amiri;font-weight:700;src:url('file:///home/claude/fonts/Amiri-Bold.ttf')}
:root{--y:#e9f23a;--r:#ff8a5c;--g:#7fe0a0;--b:#7fd6ff;--cream:#ebe6d6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:#000;overflow:hidden;font-family:Inter,sans-serif;color:#fff}
.ab{position:absolute}
.ar{font-family:Amiri,serif;direction:rtl;unicode-bidi:isolate}
.mono{font-family:'DejaVu Sans Mono',monospace;letter-spacing:.06em}
.mk{background:linear-gradient(var(--y),var(--y)) no-repeat;background-size:0% 92%;background-position:left 60%;padding:0 .08em}
.mk.on{color:#111}
.w{display:inline-block;opacity:0;transform:translateY(16px);margin-right:.24em}
.paper{background:var(--cream);color:#151515;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.chip{display:inline-block;padding:10px 16px;border:2px solid var(--y);color:var(--y);font:600 22px 'DejaVu Sans Mono';letter-spacing:.04em;border-radius:6px}
.card{border:4px solid var(--y);border-radius:22px;background:rgba(233,242,58,.07)}
.num{font:900 34px 'DejaVu Sans Mono';color:var(--y)}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,#16140a,#000 65%)}
#hud{position:absolute;inset:0;z-index:50;pointer-events:none}
#flash{position:absolute;inset:0;background:var(--y);opacity:0;z-index:60}
</style></head><body>
<div id="bg"></div><div id="stage" class="ab" style="inset:0"></div>
<div id="hud">
  <div class="ab mono" style="left:60px;top:150px;font-size:24px"><span style="color:var(--y)">●</span> EP 01 · HURMATUL QUR'AN</div>
  <div class="ab mono" id="cnt" style="right:60px;top:150px;font-size:24px;color:var(--y)"></div>
  <div class="ab mono" style="left:60px;top:1560px;font-size:24px">@alurziyadahku · Mengenal Al-Qur'an</div>
  <div class="ab" style="left:60px;right:60px;top:1610px;height:6px;background:rgba(233,242,58,.2)"><div id="prog" style="height:100%;width:0;background:var(--y)"></div></div>
</div><div id="flash"></div>
<script>
const TOTAL = 101, Y = '#e9f23a', R = '#ff8a5c', GR = '#7fe0a0', BL = '#7fd6ff';
const ITEMS = [], SFX = [], CUTS = [];
const S = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), eo = x => 1 - Math.pow(1 - clamp(x), 3), eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const sfx = (t, type, g = 1) => SFX.push({ t: +t.toFixed(3), type, g });
function getSFX() { return SFX; }
function node(html, css) { const d = document.createElement('div'); d.className = 'ab'; d.style.cssText = css; d.innerHTML = html; d.style.opacity = 0; S.appendChild(d); return d; }
function item(t0, t1, n, fn) { ITEMS.push({ t0, t1, n, fn }); return n; }
function show(html, css, t0, t1, kind = 'up', snd) { const n = node(html, css); if (snd) sfx(t0, snd, .8);
  return item(t0, t1, n, (lt, t) => { const k = eo(lt / .45), out = clamp((t1 - t) / .25); n.style.opacity = k * out;
    n.style.transform = kind === 'up' ? `translateY(${(1 - k) * 50}px)` : kind === 'scale' ? `scale(${.8 + .2 * k})` : kind === 'left' ? `translateX(${(1 - k) * -80}px)` : kind === 'drop' ? `translateY(${(1 - k) * -90}px) rotate(${(1 - k) * -6}deg)` : ''; }); }
// teks kinetik kata demi kata; [kata] distabilo pada marks[i]
function kin(text, css, t0, t1, o = {}) {
  const parts = []; text.replace(/\[([^\]]+)\]|([^\s\[\]]+)/g, (m, a, b) => { if (a) a.split(' ').forEach((w, j, A) => parts.push({ w, g: parts.mk = (j ? parts.mk : (parts.mk ?? -1) + 1), last: j === A.length - 1 })); else parts.push({ w: b, g: -1 }); });
  const n = node(parts.map(p => `<span class="w${p.g >= 0 ? ' mk' : ''}" data-g="${p.g}">${p.w}</span>`).join(' '), css + `;font:${o.w || 800} ${o.fs || 52}px Inter;line-height:1.3;color:${o.c || '#fff'}`);
  const W = [...n.querySelectorAll('.w')], iv = o.iv || .07, M = o.m || [];
  W.forEach((w, i) => { if (i % 3 === 0) sfx(t0 + i * iv, 'tick', .45); });
  M.forEach(m => sfx(m, 'mark', .8));
  return item(t0, t1, n, (lt, t) => { n.style.opacity = clamp((t1 - t) / .25);
    W.forEach((w, i) => { const k = eo((lt - i * iv) / .25); w.style.opacity = k; w.style.transform = `translateY(${(1 - k) * 16}px)`;
      const g = +w.dataset.g; if (g >= 0 && M[g] != null) { const u = eo((t - M[g]) / .35); w.style.backgroundSize = `${u * 100}% 92%`; w.classList.toggle('on', u > .5); } }); }); }
// arab muncul per kata
function arw(text, css, t0, t1, dur, o = {}) { const parts = []; text.replace(/\[([^\]]+)\]|([^\s\[\]]+)/g, (m, a, b) => { if (a) a.split(' ').forEach(w => parts.push({ w, g: 1 })); else parts.push({ w: b, g: 0 }); });
  const n = node(parts.map(p => `<span class="w${p.g ? ' mk' : ''}" style="margin:0 .12em">${p.w}</span>`).join(' '), css + ';font-family:Amiri,serif;direction:rtl'); n.classList.add('ar');
  const W = [...n.querySelectorAll('.w')]; sfx(t0, 'whoosh', .5); if (o.mark) sfx(o.mark, 'mark', .8);
  return item(t0, t1, n, (lt, t) => { n.style.opacity = clamp((t1 - t) / .25); W.forEach((w, i) => { const k = eo((lt - i * dur / W.length) / .35); w.style.opacity = k; w.style.transform = `translateY(${(1 - k) * 14}px)`;
    if (w.classList.contains('mk') && o.mark) { const u = eo((t - o.mark) / .35); w.style.backgroundSize = `${u * 100}% 92%`; w.classList.toggle('on', u > .5); } }); }); }
function sv(inner, css, w, h, t0, t1, dur = 1) { const n = node(`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible">${inner}</svg>`, css); sfx(t0, 'draw', .5);
  return item(t0, t1, n, (lt, t) => { n.style.opacity = clamp(lt / .2) * clamp((t1 - t) / .25);
    n.querySelectorAll('[data-d]').forEach(p => { const L = +p.dataset.d, k = eio((lt - +(p.dataset.del || 0)) / dur); p.style.strokeDasharray = L; p.style.strokeDashoffset = L * (1 - k); });
    n.querySelectorAll('[data-f]').forEach(p => { p.style.opacity = eo((lt - +p.dataset.f) / .35); }); }); }
const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" data-f="${o.f ?? 0}" text-anchor="${o.a || 'middle'}" font-family="Inter" font-weight="${o.fw || 900}" font-size="${o.fs || 34}" fill="${o.c || '#fff'}">${s}</text>`;
function scene(t, cut = 'flash') { CUTS.push({ t, cut }); if (t > 0) sfx(t, cut === 'flash' ? 'whoosh' : 'click', .7); }
const header = (no, title, t0, t1, c = Y) => show(`<div style="display:flex;align-items:center;gap:22px"><div style="width:110px;height:110px;border-radius:20px;background:${c};color:#111;font:900 56px Inter;display:flex;align-items:center;justify-content:center">${no}</div><div><div class="mono" style="font-size:24px;color:${c}">ADAB KE-${+no}</div><div style="font:900 50px Inter;line-height:1.1;margin-top:6px">${title}</div></div></div>`, 'left:70px;top:250px;width:940px', t0, t1, 'left', 'stamp');
const flow = (steps, top, t0s, t1) => steps.forEach(([e, s, c], i) => { show(`<div style="width:290px;height:250px;border:4px solid ${c};border-radius:20px;text-align:center;padding-top:26px;background:rgba(255,255,255,.03)"><div style="font-size:84px">${e}</div><div style="font:900 30px Inter;color:${c};margin-top:8px;line-height:1.15">${s}</div></div>`, `left:${60 + i * 340}px;top:${top}px`, t0s[i], t1, 'up', 'click');
  if (i) show(`<div style="font:900 50px Inter;color:${Y}">→</div>`, `left:${i * 340 + 22}px;top:${top + 95}px`, t0s[i] - .15, t1, 'scale'); });

// ======================================================= 0 HOOK (0–3.6)
scene(0, 'none');
kin('sudah sering membaca [Al-Qur\'an]…', 'left:70px;top:420px;width:940px', .15, 3.6, { fs: 76, iv: .09, m: [.9] });
show(`<div style="font:900 104px Inter;line-height:1.02">tapi sudah tahu<br><span style="color:#111;background:${Y};padding:0 .12em">4 ADAB</span> ini?</div>`, 'left:70px;top:820px;width:940px', 1.5, 3.6, 'scale', 'impact');
show(`<div style="display:flex;gap:18px">${['01', '02', '03', '04'].map(n => `<div style="width:120px;height:120px;border:4px solid ${Y};border-radius:18px;display:flex;align-items:center;justify-content:center" class="num">${n}</div>`).join('')}</div>`, 'left:70px;top:1220px', 2.2, 3.6, 'up', 'beep');

// ======================================================= 1 INTRO (3.6–9.5)
scene(3.6);
show(`<div style="width:380px;background:#fbfaf6;padding:16px 16px 54px;box-shadow:0 30px 70px rgba(0,0,0,.6);position:relative"><div style="width:348px;height:400px;background:url(file:///home/claude/proj10/user_photo.jpg) 45% 40%/cover"></div><div class="mono" style="position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:17px;color:#333">PENYAMPAI · @alurziyadahku</div></div>`, 'left:610px;top:300px;transform-origin:50% 0', 3.7, 9.5, 'drop', 'paper');
show(`<div class="ar" style="font-size:112px;color:${Y};line-height:1.3">حُرْمَةُ الْقُرْآنِ</div>`, 'left:70px;top:360px;width:520px;text-align:right', 3.9, 9.5, 'scale', 'impact');
kin('sebelum membahas surah & ayat, kenali dulu [kehormatan Al-Qur\'an] yang mesti kita jaga', 'left:70px;top:900px;width:940px', 4.8, 9.5, { fs: 58, iv: .07, m: [6.9] });

// ======================================================= 2 ADAB 01 · SUCI (9.5–31)
scene(9.5);
header('01', 'SUCI sebelum menyentuh mushaf', 9.6, 31);
[['hadas kecil', 11.4], ['hadas besar', 12.4], ['najis di tangan', 13.4]].forEach(([s, t], i) => show(`<div style="width:300px;height:150px;border:3px solid #fff;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center"><div class="mono" style="font-size:22px;color:${Y}">BEBAS DARI</div><div style="font:900 34px Inter;margin-top:8px">${s}</div></div>`, `left:${60 + i * 330}px;top:440px`, t, 31, 'up', 'click'));
show('<div class="paper" style="width:960px;height:420px"></div>', 'left:60px;top:660px', 15.0, 23.4, 'up', 'paper');
arw('لَا يَمَسُّهُ إِلَّا [الْمُطَهَّرُونَ]', 'left:90px;top:700px;width:900px;text-align:center;font-size:92px;color:#151515;line-height:1.7', 15.4, 23.4, 2.0, { mark: 17.6 });
kin('tidak menyentuhnya kecuali [orang-orang yang suci]', 'left:110px;top:900px;width:860px;text-align:center', 18.0, 23.4, { fs: 40, c: '#222', iv: .06, m: [19.6] });
show('<span class="chip">QS. AL-WAQI\'AH : 79</span>', 'left:60px;top:1110px', 16.4, 23.4, 'up');
kin('mau ambil mushaf dari lemari? periksa dulu [kesucian diri]', 'left:70px;top:680px;width:940px', 23.5, 31, { fs: 50, iv: .06, m: [25.0] });
flow([['🚫', 'belum suci', R], ['💧', 'ambil wudu', BL], ['📖', 'sentuh mushaf ✓', GR]], 900, [25.8, 27.2, 28.6], 31);

// ======================================================= 3 ADAB 02 · MULUT BERSIH (31–56)
scene(31);
header('02', 'MULUT BERSIH saat membaca', 31.1, 56, BL);
[['🪥', 'disunnahkan bersiwak', 33.0], ['🚫', 'bersih dari najis & bau tak sedap', 34.4]].forEach(([e, s, t], i) => show(`<div style="width:460px;height:200px;border:4px solid ${BL};border-radius:20px;display:flex;gap:18px;align-items:center;padding:0 24px"><div style="font-size:72px">${e}</div><div style="font:900 32px Inter;line-height:1.2">${s}</div></div>`, `left:${60 + i * 500}px;top:430px`, t, 47.5, 'up', 'click'));
show('<div class="paper" style="width:960px;height:560px"></div>', 'left:60px;top:680px', 36.4, 47.5, 'up', 'paper');
arw('إِنَّ أَفْوَاهَكُمْ [طُرُقٌ مِنْ طُرُقِ الْقُرْآنِ] فَطَهِّرُوهَا وَنَظِّفُوهَا مَا اسْتَطَعْتُمْ', 'left:100px;top:710px;width:880px;text-align:center;font-size:62px;color:#151515;line-height:1.75', 36.8, 47.5, 3.6, { mark: 39.4 });
kin('"mulutmu adalah [jalan Al-Qur\'an] · bersihkan semampumu"', 'left:110px;top:1030px;width:860px;text-align:center', 41.0, 47.5, { fs: 40, c: '#222', iv: .06, m: [42.6] });
show('<span class="chip">ATSAR YAZID BIN ABI MALIK · TAFSIR AL-QURTHUBI J.1 H.27</span>', 'left:60px;top:1270px', 38.0, 47.5, 'up');
kin('buang angin saat sedang membaca? [jangan diteruskan]', 'left:70px;top:680px;width:940px', 47.6, 56, { fs: 54, iv: .06, m: [49.6] });
flow([['✋', 'berhenti dulu', R], ['💧', 'ambil wudu', BL], ['📖', 'baru membaca lagi', GR]], 920, [50.6, 52.0, 53.4], 56);

// ======================================================= 4 ADAB 03 · DUDUK TEGAK (56–70)
scene(56);
header('03', 'DUDUK TEGAK, jangan bersandar', 56.1, 70, GR);
const fig = (x, lean, c) => `<g transform="translate(${x} 0)"><circle cx="${lean * 1.2}" cy="560" r="44" fill="none" stroke="${c}" stroke-width="7"/><path d="M${lean} 610 L0 820 L120 820 L150 940 M0 820 L-60 940" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M${lean * .6} 690 L110 720" stroke="${c}" stroke-width="8" stroke-linecap="round"/><rect x="100" y="690" width="70" height="50" rx="6" fill="${c}"/></g>`;
sv(fig(250, 0, GR) + `<path d="M250 600 V820" stroke="${Y}" stroke-width="5" stroke-dasharray="10 10" data-d="220" data-del=".6"/>` + T(300, 1020, 'TEGAK ✓', { fs: 44, c: GR, f: .8 }) + T(300, 1070, 'lebih afdhal', { fs: 32, f: 1.0 }) +
  `<path d="M740 470 L760 960" stroke="#fff" stroke-width="10" data-f="3.6"/>` + `<g data-f="3.4">${fig(720, 60, R)}</g>` + T(780, 1020, 'BERSANDAR', { fs: 44, c: R, f: 3.8 }) + T(780, 1070, 'tidak haram · tidak makruh', { fs: 30, f: 6.2 }), 'left:0;top:0', 1080, 1200, 57.0, 70, .8);
kin('bersandar [tidak haram & tidak makruh] · cuma afdhalnya duduk tegak', 'left:70px;top:1260px;width:940px', 62.6, 70, { fs: 44, iv: .06, m: [64.4] });

// ======================================================= 5 ADAB 04 · PAKAIAN (70–92)
scene(70);
header('04', 'PAKAIAN bersih, elok & menutup aurat', 70.1, 92, R);
sv(`<circle cx="260" cy="520" r="52" fill="none" stroke="#fff" stroke-width="7"/><path d="M260 575 V800 M260 640 L170 760 M260 640 L350 760 M260 800 L200 960 M260 800 L320 960" stroke="#fff" stroke-width="8" stroke-linecap="round"/>` +
  `<path d="M180 450 Q260 400 340 450 L380 640 L360 980 L160 980 L140 640 Z" fill="rgba(233,242,58,.08)" stroke="${Y}" stroke-width="5" stroke-dasharray="14 10" data-d="1400" data-del="1.4"/>` + T(260, 1040, 'tutup aurat', { fs: 36, c: Y, f: 2.6 }), 'left:0;top:0', 1080, 1200, 70.6, 92, 1.4);
[['✓ bersih', 72.0], ['✓ elok · indah', 73.2], ['✓ menutup aurat', 74.4]].forEach(([s, t], i) => show(`<div style="font:900 40px Inter;color:${Y}">${s}</div>`, `left:520px;top:${470 + i * 80}px`, t, 79.4, 'left', 'tick'));
kin('walaupun [sendirian] · di tempat sunyi · di kamar terkunci', 'left:520px;top:740px;width:500px', 75.8, 79.4, { fs: 40, iv: .06, m: [76.6] });
[['yang DIPEGANG', 'kitab Allah', 79.6], ['yang DIBACA', 'kalam Allah', 81.6], ['yang DIHADAPI', 'Allah ﷻ', 83.6]].forEach(([a, b, t], i) => show(`<div style="width:500px;border-left:8px solid ${Y};padding:12px 22px;background:rgba(233,242,58,.06)"><div class="mono" style="font-size:22px;color:${Y}">${a}</div><div style="font:900 44px Inter">${b}</div></div>`, `left:520px;top:${450 + i * 160}px`, t, 92, 'left', 'click'));
kin('kita sedang [bermunajat] · berdialog dengan Allah', 'left:70px;top:1260px;width:940px', 86.4, 92, { fs: 50, iv: .07, m: [87.6] });

// ======================================================= 6 PENUTUP (92–101)
scene(92);
show(`<div style="font:900 64px Inter;line-height:1.1">jaga <span style="color:#111;background:${Y};padding:0 .1em">kehormatan</span><br>Al-Qur'an</div>`, 'left:70px;top:250px;width:940px', 92.1, TOTAL, 'up', 'impact');
[['01', '🧼', 'suci'], ['02', '🪥', 'mulut bersih'], ['03', '🧍', 'duduk tegak'], ['04', '👕', 'pakaian & aurat']].forEach(([n, e, s], i) => show(`<div style="width:450px;height:190px;border:4px solid ${Y};border-radius:20px;display:flex;align-items:center;gap:18px;padding:0 22px"><div class="num">${n}</div><div style="font-size:60px">${e}</div><div style="font:900 32px Inter">${s}</div></div>`, `left:${60 + (i % 2) * 510}px;top:${470 + Math.floor(i / 2) * 220}px`, 92.6 + i * .35, TOTAL, 'scale', 'tick'));
show('<div style="font:800 40px Inter">💾 simpan · 🔁 bagikan ke keluarga</div>', 'left:70px;top:960px', 94.6, TOTAL, 'up', 'beep');
(() => { const n = node(`<div style="display:flex;align-items:center;gap:22px"><div style="width:120px;height:120px;border-radius:50%;border:5px solid ${Y};background:url(file:///home/claude/proj10/user_photo.jpg) 45% 30%/170% auto"></div><div style="font:800 42px Inter">@alurziyadahku</div><div class="sb" style="font:900 36px Inter;padding:16px 26px;border-radius:12px;background:#d7322b">SUBSCRIBE</div></div><div style="font:700 32px Inter;margin-top:26px;color:${Y}">▶ tonton Ep 01 lengkap di kanal kami</div>`, 'left:70px;top:1120px');
  item(95.4, TOTAL, n, (lt, t) => { n.style.opacity = eo(lt / .4); const sb = n.querySelector('.sb'); const on = t > 97.4; sb.textContent = on ? 'SUBSCRIBED ✓' : 'SUBSCRIBE'; sb.style.background = on ? '#2fae5b' : '#d7322b'; sb.style.transform = `scale(${t > 97.2 && t < 97.6 ? .92 : 1})`; }); sfx(97.4, 'click', 1); })();

// ======================================================= mesin waktu
const HUDC = document.getElementById('cnt'), PROG = document.getElementById('prog'), FL = document.getElementById('flash');
const ADAB = [[9.5, 31, 'ADAB 1/4'], [31, 56, 'ADAB 2/4'], [56, 70, 'ADAB 3/4'], [70, 92, 'ADAB 4/4']];
window.setTime = t => {
  for (const it of ITEMS) { const on = t >= it.t0 && t < it.t1; it.n.style.display = on ? '' : 'none'; if (on) it.fn(t - it.t0, t); }
  PROG.style.width = (t / TOTAL * 100) + '%'; const a = ADAB.find(a => t >= a[0] && t < a[1]); HUDC.textContent = a ? a[2] : '';
  let f = 0; for (const c of CUTS) if (c.cut === 'flash' && t >= c.t && t < c.t + .25) f = .35 * (1 - (t - c.t) / .25); FL.style.opacity = f;
  const z = 1 + .015 * Math.sin(t * .4); S.style.transform = `scale(${z})`;
};
setTime(0);
</script></body></html>
