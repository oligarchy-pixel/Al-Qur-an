<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Amiri;src:url('file:///home/claude/fonts/Amiri-Regular.ttf')}
@font-face{font-family:Amiri;font-weight:700;src:url('file:///home/claude/fonts/Amiri-Bold.ttf')}
:root{--y:#e9f23a;--r:#ff8a5c;--g:#7fe0a0;--b:#7fd6ff;--cream:#ebe6d6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:#000;overflow:hidden;font-family:Inter,sans-serif;color:#fff}
.ab{position:absolute}
.ar{font-family:Amiri,serif;direction:rtl;unicode-bidi:isolate}
.mono{font-family:'DejaVu Sans Mono',monospace;letter-spacing:.06em}
.mk{background:linear-gradient(var(--y),var(--y)) no-repeat;background-size:0% 92%;background-position:left 60%;padding:0 .08em}
.mk.on{color:#111}
.w{display:inline-block;opacity:0;transform:translateY(16px);margin-right:.24em}
.paper{background:var(--cream);color:#151515;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.chip{display:inline-block;padding:10px 16px;border:2px solid var(--y);color:var(--y);font:600 22px 'DejaVu Sans Mono';letter-spacing:.04em;border-radius:6px}
.card{border:4px solid var(--y);border-radius:22px;background:rgba(233,242,58,.07)}
.num{font:900 34px 'DejaVu Sans Mono';color:var(--y)}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,#16140a,#000 65%)}
#hud{position:absolute;inset:0;z-index:50;pointer-events:none}
#flash{position:absolute;inset:0;background:var(--y);opacity:0;z-index:60}
</style></head><body>
<div id="bg"></div><div id="stage" class="ab" style="inset:0"></div>
<div id="hud">
  <div class="ab mono" style="left:60px;top:150px;font-size:24px"><span style="color:var(--y)">●</span> EP 02 · 16 ADAB AL-QUR'AN</div>
  <div class="ab mono" id="cnt" style="right:60px;top:150px;font-size:24px;color:var(--y)"></div>
  <div class="ab mono" style="left:60px;top:1560px;font-size:24px">@alurziyadahku · Mengenal Al-Qur'an</div>
  <div class="ab" style="left:60px;right:60px;top:1610px;height:6px;background:rgba(233,242,58,.2)"><div id="prog" style="height:100%;width:0;background:var(--y)"></div></div>
</div><div id="flash"></div>
<script>
const TOTAL = 92, Y = '#e9f23a', R = '#ff8a5c', GR = '#7fe0a0', BL = '#7fd6ff';
const CG = GR, CB = BL, CR = R;
const ITEMS = [], SFX = [], CUTS = [];
const S = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), eo = x => 1 - Math.pow(1 - clamp(x), 3), eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const sfx = (t, type, g = 1) => SFX.push({ t: +t.toFixed(3), type, g });
function getSFX() { return SFX; }
function node(html, css) { const d = document.createElement('div'); d.className = 'ab'; d.style.cssText = css; d.innerHTML = html; d.style.opacity = 0; S.appendChild(d); return d; }
function item(t0, t1, n, fn) { ITEMS.push({ t0, t1, n, fn }); return n; }
function show(html, css, t0, t1, kind = 'up', snd) { const n = node(html, css); if (snd) sfx(t0, snd, .8);
  return item(t0, t1, n, (lt, t) => { const k = eo(lt / .45), out = clamp((t1 - t) / .25); n.style.opacity = k * out;
    n.style.transform = kind === 'up' ? `translateY(${(1 - k) * 50}px)` : kind === 'scale' ? `scale(${.8 + .2 * k})` : kind === 'left' ? `translateX(${(1 - k) * -80}px)` : kind === 'drop' ? `translateY(${(1 - k) * -90}px) rotate(${(1 - k) * -6}deg)` : ''; }); }
// teks kinetik kata demi kata; [kata] distabilo pada marks[i]
function kin(text, css, t0, t1, o = {}) {
  const parts = []; text.replace(/\[([^\]]+)\]|([^\s\[\]]+)/g, (m, a, b) => { if (a) a.split(' ').forEach((w, j, A) => parts.push({ w, g: parts.mk = (j ? parts.mk : (parts.mk ?? -1) + 1), last: j === A.length - 1 })); else parts.push({ w: b, g: -1 }); });
  const n = node(parts.map(p => `<span class="w${p.g >= 0 ? ' mk' : ''}" data-g="${p.g}">${p.w}</span>`).join(' '), css + `;font:${o.w || 800} ${o.fs || 52}px Inter;line-height:1.3;color:${o.c || '#fff'}`);
  const W = [...n.querySelectorAll('.w')], iv = o.iv || .07, M = o.m || [];
  W.forEach((w, i) => { if (i % 3 === 0) sfx(t0 + i * iv, 'tick', .45); });
  M.forEach(m => sfx(m, 'mark', .8));
  return item(t0, t1, n, (lt, t) => { n.style.opacity = clamp((t1 - t) / .25);
    W.forEach((w, i) => { const k = eo((lt - i * iv) / .25); w.style.opacity = k; w.style.transform = `translateY(${(1 - k) * 16}px)`;
      const g = +w.dataset.g; if (g >= 0 && M[g] != null) { const u = eo((t - M[g]) / .35); w.style.backgroundSize = `${u * 100}% 92%`; w.classList.toggle('on', u > .5); } }); }); }
// arab muncul per kata
function arw(text, css, t0, t1, dur, o = {}) { const parts = []; text.replace(/\[([^\]]+)\]|([^\s\[\]]+)/g, (m, a, b) => { if (a) a.split(' ').forEach(w => parts.push({ w, g: 1 })); else parts.push({ w: b, g: 0 }); });
  const n = node(parts.map(p => `<span class="w${p.g ? ' mk' : ''}" style="margin:0 .12em">${p.w}</span>`).join(' '), css + ';font-family:Amiri,serif;direction:rtl'); n.classList.add('ar');
  const W = [...n.querySelectorAll('.w')]; sfx(t0, 'whoosh', .5); if (o.mark) sfx(o.mark, 'mark', .8);
  return item(t0, t1, n, (lt, t) => { n.style.opacity = clamp((t1 - t) / .25); W.forEach((w, i) => { const k = eo((lt - i * dur / W.length) / .35); w.style.opacity = k; w.style.transform = `translateY(${(1 - k) * 14}px)`;
    if (w.classList.contains('mk') && o.mark) { const u = eo((t - o.mark) / .35); w.style.backgroundSize = `${u * 100}% 92%`; w.classList.toggle('on', u > .5); } }); }); }
function sv(inner, css, w, h, t0, t1, dur = 1) { const n = node(`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible">${inner}</svg>`, css); sfx(t0, 'draw', .5);
  return item(t0, t1, n, (lt, t) => { n.style.opacity = clamp(lt / .2) * clamp((t1 - t) / .25);
    n.querySelectorAll('[data-d]').forEach(p => { const L = +p.dataset.d, k = eio((lt - +(p.dataset.del || 0)) / dur); p.style.strokeDasharray = L; p.style.strokeDashoffset = L * (1 - k); });
    n.querySelectorAll('[data-f]').forEach(p => { p.style.opacity = eo((lt - +p.dataset.f) / .35); }); }); }
const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" data-f="${o.f ?? 0}" text-anchor="${o.a || 'middle'}" font-family="Inter" font-weight="${o.fw || 900}" font-size="${o.fs || 34}" fill="${o.c || '#fff'}">${s}</text>`;
function scene(t, cut = 'flash') { CUTS.push({ t, cut }); if (t > 0) sfx(t, cut === 'flash' ? 'whoosh' : 'click', .7); }
const header = (no, title, t0, t1, c = Y) => show(`<div style="display:flex;align-items:center;gap:22px"><div style="width:110px;height:110px;border-radius:20px;background:${c};color:#111;font:900 56px Inter;display:flex;align-items:center;justify-content:center">${no}</div><div><div class="mono" style="font-size:24px;color:${c}">ADAB KE-${+no}</div><div style="font:900 50px Inter;line-height:1.1;margin-top:6px">${title}</div></div></div>`, 'left:70px;top:250px;width:940px', t0, t1, 'left', 'stamp');
const flow = (steps, top, t0s, t1) => steps.forEach(([e, s, c], i) => { show(`<div style="width:290px;height:250px;border:4px solid ${c};border-radius:20px;text-align:center;padding-top:26px;background:rgba(255,255,255,.03)"><div style="font-size:84px">${e}</div><div style="font:900 30px Inter;color:${c};margin-top:8px;line-height:1.15">${s}</div></div>`, `left:${60 + i * 340}px;top:${top}px`, t0s[i], t1, 'up', 'click');
  if (i) show(`<div style="font:900 50px Inter;color:${Y}">→</div>`, `left:${i * 340 + 22}px;top:${top + 95}px`, t0s[i] - .15, t1, 'scale'); });
const A = x => +(x - 5.4).toFixed(2); // waktu audio Ep2 → waktu short (suara mulai detik 3.5 = audio 8.9)
// tombol CTA: like, follow, subscribe
function cta(t0, t1, top) { const n = node(`<div style="display:flex;gap:22px;justify-content:center">
  <div class="b1" style="width:290px;height:150px;border:5px solid #ff4d6d;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center"><div class="i" style="font-size:66px">🤍</div><div style="font:900 34px Inter;color:#ff4d6d">LIKE</div></div>
  <div class="b2" style="width:290px;height:150px;border:5px solid ${Y};border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center"><div class="i" style="font:900 60px Inter;color:${Y}">＋</div><div style="font:900 34px Inter;color:${Y}">FOLLOW</div></div>
  <div class="b3" style="width:290px;height:150px;border:5px solid #d7322b;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#d7322b"><div class="i" style="font-size:60px">🔔</div><div style="font:900 30px Inter;color:#fff">SUBSCRIBE</div></div></div>`, `left:60px;top:${top}px;width:960px`);
  const [b1, b2, b3] = ['.b1', '.b2', '.b3'].map(s => n.querySelector(s)), T0 = [t0 + .5, t0 + 1.0, t0 + 1.5]; T0.forEach(t => sfx(t, 'click', 1));
  return item(t0, t1, n, (lt, t) => { n.style.opacity = eo(lt / .3) * clamp((t1 - t) / .25);
    [b1, b2, b3].forEach((b, i) => { const k = t - T0[i], pop = k > 0 && k < .35 ? 1 + .18 * Math.sin(k / .35 * Math.PI) : 1; b.style.transform = `scale(${pop})`; });
    b1.querySelector('.i').textContent = t > T0[0] ? '❤️' : '🤍'; b1.style.background = t > T0[0] ? 'rgba(255,77,109,.18)' : '';
    b2.querySelector('.i').textContent = t > T0[1] ? '✓' : '＋'; b2.style.background = t > T0[1] ? 'rgba(233,242,58,.18)' : '';
    b3.querySelector('.i').style.transform = t > T0[2] ? `rotate(${Math.sin(t * 24) * 18 * clamp(1 - (t - T0[2]) / 1.2)}deg)` : ''; }); }
// panah memantul ke bawah: arahkan ke tautan video terkait (kiri bawah layar aplikasi)
function arrowDown(t0, t1, txt, top) { const n = node(`<div style="display:flex;align-items:center;gap:20px"><div style="font:900 40px Inter;line-height:1.2;width:920px">${txt}</div></div><div class="ar2" style="position:absolute;left:30px;top:130px;font:900 120px Inter;color:${Y}">⬇</div>`, `left:70px;top:${top}px;width:960px;height:300px`);
  sfx(t0, 'beep', .9); return item(t0, t1, n, (lt, t) => { n.style.opacity = eo(lt / .3) * clamp((t1 - t) / .25); n.querySelector('.ar2').style.transform = `translateY(${Math.abs(Math.sin(t * 5)) * 40}px)`; }); }

// ======================================================= 0 HOOK + CTA (0–3.5)
scene(0, 'none');
show(`<div style="font:900 86px Inter;line-height:1.02">sebelum mulai…<br><span style="color:#111;background:${Y};padding:0 .12em">bantu kami</span> 🙏</div>`, 'left:70px;top:300px;width:940px', .1, 3.5, 'scale', 'impact');
cta(.4, 3.5, 620);
arrowDown(1.6, 3.5, `📺 video lengkapnya <span style="color:${Y}">klik di bawah ini</span>`, 860);

// ======================================================= 1 ADAB 01 · MENGHADAP KIBLAT (audio 8.9–31.3)
scene(3.5);
header('01', 'MENGHADAP KIBLAT ketika membaca', A(8.9), A(31.3));
arw('أَنْ يَسْتَقْبِلَ [الْقِبْلَةَ]', 'left:60px;top:420px;width:960px;text-align:center;font-size:96px;color:#fff;line-height:1.5', A(8.9), A(18.3), 1.4, { mark: A(9.8) });
kin('ketika hendak membaca Al-Qur\'an → [menghadap kiblat]', 'left:70px;top:600px;width:940px', A(10.5), A(18.3), { fs: 50, iv: .06, m: [A(12.6)] });
(() => { const n = node(`<div style="position:relative;width:420px;height:420px;border-radius:50%;border:6px solid ${Y};background:radial-gradient(circle,rgba(233,242,58,.10),transparent 70%)"><div style="position:absolute;left:170px;top:-10px;font-size:80px">🕋</div><div class="nd" style="position:absolute;left:204px;top:60px;width:12px;height:300px;background:linear-gradient(${Y} 50%,#fff 50%);border-radius:6px;transform-origin:50% 50%"></div><div style="position:absolute;left:190px;top:190px;width:40px;height:40px;border-radius:50%;background:#fff"></div></div>`, 'left:330px;top:820px');
  item(A(14.1), A(18.3), n, (lt, t) => { n.style.opacity = eo(lt / .3) * clamp((A(18.3) - t) / .25); n.querySelector('.nd').style.transform = `rotate(${(1 - eio(lt / 1.6)) * 150 + Math.sin(t * 3) * 3 * clamp(lt - 1.6)}deg)`; }); sfx(A(14.1), 'whoosh', .7); })();
show(`<div style="font:900 40px Inter;color:${Y}">kiblat = arah yang paling mulia</div>`, 'left:70px;top:1300px', A(15.9), A(18.3), 'up', 'beep');
kin('membelakangi kiblat vs menghadap kiblat → [lain pahalanya]', 'left:70px;top:420px;width:940px', A(18.3), A(31.3), { fs: 50, iv: .06, m: [A(24.0)] });
[['membelakangi kiblat', ['📖 pahala membaca'], '#fff', A(20.0)], ['menghadap kiblat', ['📖 pahala membaca', '🕋 + pahala menghadap kiblat'], CG, A(22.6)]].forEach(([h, L, c, t], i) => show(`<div style="width:450px;border:5px solid ${c};border-radius:20px;padding:24px"><div style="font:900 36px Inter;color:${c}">${h}</div>${L.map(s => `<div style="font:800 30px Inter;margin-top:14px">${s}</div>`).join('')}</div>`, `left:${60 + i * 510}px;top:680px`, t, A(31.3), 'up', 'stamp'));
show(`<div style="font:900 44px Inter;color:#111;background:${Y};border-radius:12px;padding:10px 22px">DOUBLE PAHALA ✓</div>`, 'left:560px;top:1060px', A(26.3), A(31.3), 'scale', 'impact');

// ======================================================= 2 ADAB 02 · BERHENTI SAAT MENGUAP (audio 31.3–49.9)
scene(A(31.3));
header('02', 'BERHENTI saat menguap', A(31.3), A(49.9), CB);
arw('أَنْ يُمْسِكَ عَنِ الْقِرَاءَةِ [إِذَا تَثَاءَبَ]', 'left:60px;top:420px;width:960px;text-align:center;font-size:72px;color:#fff;line-height:1.6', A(31.3), A(49.9), 2.4, { mark: A(33.6) });
kin('berhenti membaca Al-Qur\'an [ketika menguap]', 'left:70px;top:600px;width:940px', A(36.5), A(42.3), { fs: 50, iv: .06, m: [A(38.4)] });
show(`<div style="font:900 44px Inter;color:${CR}">⚠ menguap itu dari SYAITAN</div>`, 'left:70px;top:740px', A(40.2), A(49.9), 'left', 'impact');
flow([['🥱', 'menguap', CR], ['✋', 'berhenti dulu', CB], ['📖', 'lanjut membaca', CG]], 860, [A(42.3), A(43.6), A(45.0)], A(49.9));
kin('jangan dicampur · bisa [merusak sebutan huruf] Al-Qur\'an', 'left:70px;top:1150px;width:940px', A(45.6), A(49.9), { fs: 40, iv: .05, m: [A(47.4)] });

// ======================================================= 3 ADAB 03 · TA'AWWUDZ (audio 49.9–91.7)
scene(A(49.9));
header('03', "membaca TA'AWWUDZ ketika memulai", A(49.9), A(91.7), CG);
arw('أَنْ [يَسْتَعِيذَ بِاللَّهِ] مِنَ الشَّيْطَانِ عِنْدَ ابْتِدَائِهِ', 'left:60px;top:420px;width:960px;text-align:center;font-size:62px;color:#fff;line-height:1.6', A(49.9), A(57.7), 2.6, { mark: A(51.4) });
kin('ucapkan [a\'udzu billah] ketika memulai membaca', 'left:70px;top:620px;width:940px', A(53.8), A(57.7), { fs: 50, iv: .06, m: [A(55.4)] });
[['MINIMAL', 'أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ', '#fff', A(57.7)], ['SELENGKAPNYA', 'أَعُوذُ بِاللَّهِ السَّمِيعِ الْعَلِيمِ مِنَ الشَّيْطَانِ الرَّجِيمِ', Y, A(61.5)]].forEach(([h, ar, c, t], i) => show(`<div style="width:960px;border:5px solid ${c};border-radius:20px;padding:20px 26px"><div class="mono" style="font-size:24px;color:${c}">${h}</div><div class="ar" style="font-size:52px;text-align:right;margin-top:6px;color:${c}">${ar}</div></div>`, `left:60px;top:${420 + i * 210}px`, t, A(73.0), 'up', 'stamp'));
show(`<div style="font:900 40px Inter">+ lanjut <span style="color:${Y}">basmalah</span> pun boleh</div>`, 'left:70px;top:880px', A(66.6), A(73.0), 'left', 'tick');
show(`<div style="font:900 44px Inter;color:#111;background:${Y};border-radius:12px;padding:10px 22px">yang penting: a'udzu billah ✓</div>`, 'left:70px;top:980px', A(70.2), A(73.0), 'scale', 'impact');
[['AWAL SURAH', "ta'awwudz + basmalah", 'أَعُوذُ بِاللَّهِ ... ‏ بِسْمِ اللَّهِ', Y, A(73.0)], ['PERTENGAHAN SURAH', 'terserah · boleh tanpa basmalah', 'أَعُوذُ بِاللَّهِ', CB, A(80.5)]].forEach(([h, s, ar, c, t], i) => show(`<div style="width:960px;border:5px solid ${c};border-radius:20px;padding:22px 26px"><div class="mono" style="font-size:26px;color:${c}">${h}</div><div style="font:900 40px Inter;margin-top:8px">${s}</div><div class="ar" style="font-size:48px;text-align:right;color:${c}">${ar}</div></div>`, `left:60px;top:${420 + i * 290}px`, t, A(91.7), 'up', 'stamp'));
kin('itu tidak mengurangi [kehormatan Al-Qur\'an]', 'left:70px;top:1030px;width:940px', A(87.5), A(91.7), { fs: 44, iv: .05, m: [A(89.6)] });

// ======================================================= 4 PENUTUP + CTA (86.3–92)
scene(A(91.7));
show(`<div style="display:flex;gap:16px">${[['01', '🕋', 'kiblat'], ['02', '🥱', 'menguap'], ['03', '🛡️', "ta'awwudz"]].map(([n, e, s]) => `<div style="width:300px;height:170px;border:4px solid ${Y};border-radius:18px;text-align:center;padding-top:14px"><div class="num" style="font-size:26px">${n}</div><div style="font-size:52px">${e}</div><div style="font:900 28px Inter">${s}</div></div>`).join('')}</div>`, 'left:60px;top:260px', A(91.8), TOTAL, 'scale', 'tick');
cta(A(91.9), TOTAL, 480);
arrowDown(A(92.4), TOTAL, `masih banyak adab lainnya 📖<br>tonton video lengkapnya → <span style="color:${Y}">klik di bawah ini</span>`, 700);

// ======================================================= mesin waktu
const HUDC = document.getElementById('cnt'), PROG = document.getElementById('prog'), FL = document.getElementById('flash');
const ADAB = [[A(8.9), A(31.3), 'ADAB 1/3'], [A(31.3), A(49.9), 'ADAB 2/3'], [A(49.9), A(91.7), 'ADAB 3/3']];
window.setTime = t => {
  for (const it of ITEMS) { const on = t >= it.t0 && t < it.t1; it.n.style.display = on ? '' : 'none'; if (on) it.fn(t - it.t0, t); }
  PROG.style.width = (t / TOTAL * 100) + '%'; const a = ADAB.find(a => t >= a[0] && t < a[1]); HUDC.textContent = a ? a[2] : '';
  let f = 0; for (const c of CUTS) if (c.cut === 'flash' && t >= c.t && t < c.t + .25) f = .35 * (1 - (t - c.t) / .25); FL.style.opacity = f;
  const z = 1 + .015 * Math.sin(t * .4); S.style.transform = `scale(${z})`;
};
setTime(0);
</script></body></html>
